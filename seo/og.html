<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#F1ECFF;font-family:Inter,sans-serif;color:#16121F;position:relative;overflow:hidden}
.dots{position:absolute;inset:0;background-image:radial-gradient(#d6caff 2px,transparent 2px);background-size:28px 28px;opacity:.7}
.blob{position:absolute;right:-120px;top:-140px;width:620px;height:620px;border-radius:50%;background:#FFD23F;border:6px solid #16121F}
.left{position:absolute;left:72px;top:84px;width:640px}
.logo{display:flex;align-items:center;gap:18px;margin-bottom:34px}
.logo i{width:74px;height:74px;border-radius:20px;background:#FF3D8B;border:5px solid #16121F;box-shadow:5px 5px 0 #16121F;display:grid;place-items:center;font:900 48px 'Inter Display',Inter;font-style:normal;color:#16121F}
.logo i span{width:46px;height:46px;border-radius:12px;background:#FFD23F;border:4px solid #16121F;display:grid;place-items:center;font-size:34px;line-height:1}
.logo b{font:900 40px 'Inter Display',Inter;letter-spacing:-.5px}
.logo b em{color:#FF3D8B;font-style:normal}
h1{font:900 76px/0.98 'Inter Display',Inter;letter-spacing:-2px}
h1 em{font-style:normal;background:#FF3D8B;color:#fff;padding:0 14px;border:5px solid #16121F;border-radius:18px;box-shadow:6px 6px 0 #16121F;display:inline-block;transform:rotate(-2deg);margin-top:10px}
p.sub{font:600 27px/1.35 Inter;color:#3c3550;margin-top:30px;width:600px}
.chips{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;width:640px}
.chips span{font:700 21px Inter;background:#fff;border:3px solid #16121F;border-radius:999px;padding:8px 18px;box-shadow:3px 3px 0 #16121F}
.ticket{position:absolute;right:70px;top:150px;width:380px;background:#fff;border:5px solid #16121F;border-radius:28px;box-shadow:10px 10px 0 #16121F;transform:rotate(4deg);overflow:hidden}
.ticket .top{background:#3F5BFF;color:#fff;padding:16px 24px;font:800 18px 'DejaVu Sans Mono',monospace;letter-spacing:2px;display:flex;justify-content:space-between}
.ticket .route{display:flex;justify-content:space-between;align-items:center;padding:26px 24px 8px}
.ticket .route b{font:900 60px 'Inter Display',Inter;letter-spacing:-1px}
.ticket .route small{display:block;font:600 16px Inter;color:#5E5770;letter-spacing:0}
.ticket .route i{font-style:normal;font-size:34px}
.ticket .row{display:flex;justify-content:space-between;padding:14px 24px 24px;border-top:4px dashed #D9D1EE;margin-top:16px}
.ticket .row div{font:600 15px Inter;color:#5E5770}
.ticket .row div b{display:block;font:900 30px 'Inter Display',Inter;color:#16121F}
.url{position:absolute;left:72px;bottom:44px;font:700 22px 'DejaVu Sans Mono',monospace;color:#5E5770}
</style></head><body>
<div class="dots"></div><div class="blob"></div>
<div class="left">
 <div class="logo"><i><span>?</span></i><b>Kidhar Chale<em>?</em></b></div>
 <h1>Plan a budget trip<br><em>in seconds</em></h1>
 <p class="sub">Day-by-day plans with buses, trains, cheap stays and what it really costs.</p>
 <div class="chips"><span>687 places</span><span>Real costs in ₹</span><span>Free · no sign-up</span></div>
</div>
<div class="ticket">
 <div class="top"><span>TRIP PASS</span><span>BUS · TRAIN</span></div>
 <div class="route"><div><b>JDH</b><small>Jodhpur</small></div><i>→</i><div style="text-align:right"><b>JSL</b><small>Jaisalmer</small></div></div>
 <div class="row"><div><b>3</b>days</div><div><b>₹4,200</b>all in</div><div><b>₹1,400</b>a day</div></div>
</div>

</body></html>
